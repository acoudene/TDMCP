<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <style>
      .title { font: 700 42px Arial, Helvetica, sans-serif; fill: #1f3b5b; }
      .sectionTitle { font: 700 40px Arial, Helvetica, sans-serif; fill: #234b7a; }
      .label { font: 600 26px Arial, Helvetica, sans-serif; fill: #24364a; }
      .small { font: 500 22px Arial, Helvetica, sans-serif; fill: #334155; }
      .boxText { font: 700 28px Arial, Helvetica, sans-serif; fill: #0f2a44; }
      .boxSub { font: 500 22px Arial, Helvetica, sans-serif; fill: #0f2a44; }
      .chipText { font: 700 30px Arial, Helvetica, sans-serif; fill: #2b3a2b; }
      .note { font: 600 22px Arial, Helvetica, sans-serif; fill: #5b2b2b; }
      .dash { stroke-dasharray: 8 10; }
    </style>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6cdf"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EEF530"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>

    <!-- Simple person icon -->
    <g id="personIcon">
      <circle cx="0" cy="-18" r="16" fill="#1f2937"/>
      <path d="M -26 30 C -26 6, 26 6, 26 30 L 26 54 L -26 54 Z" fill="#1f2937"/>
    </g>

    <!-- Simple AI icon -->
    <g id="aiIcon">
      <circle cx="0" cy="0" r="34" fill="#1f5fbf"/>
      <circle cx="-12" cy="-8" r="6" fill="#a7f3d0"/>
      <circle cx="10" cy="-12" r="5" fill="#fde68a"/>
      <circle cx="14" cy="8" r="6" fill="#c7d2fe"/>
      <circle cx="-6" cy="14" r="5" fill="#fca5a5"/>
      <circle cx="-18" cy="10" r="4" fill="#93c5fd"/>
      <circle cx="2" cy="0" r="5" fill="#ffffff"/>
    </g>

    <!-- Simple server icon -->
    <g id="serverIcon">
      <rect x="-65" y="-55" width="130" height="42" rx="8" fill="#334155"/>
      <rect x="-65" y="-6" width="130" height="42" rx="8" fill="#334155"/>
      <rect x="-65" y="43" width="130" height="42" rx="8" fill="#334155"/>
      <circle cx="-45" cy="-34" r="4" fill="#fbbf24"/>
      <circle cx="-30" cy="-34" r="4" fill="#60a5fa"/>
      <circle cx="-15" cy="-34" r="4" fill="#34d399"/>
      <rect x="-5" y="-38" width="58" height="8" rx="4" fill="#cbd5e1"/>
      <circle cx="-45" cy="15" r="4" fill="#fbbf24"/>
      <circle cx="-30" cy="15" r="4" fill="#60a5fa"/>
      <circle cx="-15" cy="15" r="4" fill="#34d399"/>
      <rect x="-5" y="11" width="58" height="8" rx="4" fill="#cbd5e1"/>
      <circle cx="-45" cy="64" r="4" fill="#fbbf24"/>
      <circle cx="-30" cy="64" r="4" fill="#60a5fa"/>
      <circle cx="-15" cy="64" r="4" fill="#34d399"/>
      <rect x="-5" y="60" width="58" height="8" rx="4" fill="#cbd5e1"/>
    </g>

    <!-- Simple DB icon -->
    <g id="dbIcon">
      <ellipse cx="0" cy="-35" rx="70" ry="22" fill="#64748b"/>
      <rect x="-70" y="-35" width="140" height="90" fill="#64748b"/>
      <ellipse cx="0" cy="55" rx="70" ry="22" fill="#475569"/>
      <ellipse cx="0" cy="-35" rx="70" ry="22" fill="none" stroke="#e2e8f0" stroke-width="3"/>
      <path d="M -70 -10 C -70 -22, 70 -22, 70 -10" fill="none" stroke="#e2e8f0" stroke-width="3"/>
      <path d="M -70 15 C -70 3, 70 3, 70 15" fill="none" stroke="#e2e8f0" stroke-width="3"/>
      <path d="M -70 40 C -70 28, 70 28, 70 40" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    </g>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="1600" fill="#ffffff"/>

  <!-- SECTION: Interaction -->
  <rect x="80" y="60" width="1040" height="360" rx="20" fill="#e6f0ff"/>
  <text x="240" y="120" text-anchor="middle" class="sectionTitle">Interaction</text>

  <!-- User -->
  <g transform="translate(210,255)">
    <use href="#personIcon"/>
  </g>
  <text x="210" y="340" text-anchor="middle" class="boxText">Utilisateur</text>

  <!-- LLM Box -->
  <rect x="430" y="180" width="340" height="180" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
  <g transform="translate(600,235)">
    <use href="#aiIcon"/>
  </g>
  <text x="600" y="300" text-anchor="middle" class="boxText">LLM / IA</text>
  <text x="600" y="332" text-anchor="middle" class="boxSub">Claude Desktop, Code, etc.</text>

  <!-- Prompt arrow (User -> LLM) -->
  <path d="M 270 260 C 345 220, 370 220, 430 240" fill="none" stroke="#2d6cdf" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="340" y="215" text-anchor="middle" class="label">Prompt</text>

  <!-- Response arrow (LLM -> User) -->
  <path d="M 770 250 C 900 210, 990 250, 980 330 C 970 410, 340 410, 260 350" fill="none" stroke="#2d6cdf" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="910" y="220" text-anchor="middle" class="label">Réponse</text>

  <!-- LLM self-loop: Analyse -->
  <path d="M 770 235 C 820 210, 820 170, 760 170 C 710 170, 700 185, 700 190" fill="none" stroke="#2d6cdf" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="820" y="160" text-anchor="middle" class="label">Analyse &amp; itère</text>

  <!-- Divider dashed line -->
  <line x1="90" y1="440" x2="1110" y2="440" stroke="#94a3b8" stroke-width="4" class="dash"/>

  <!-- SECTION: Prise USB-C -->
  <rect x="80" y="460" width="1040" height="260" rx="20" fill="#eef6e6"/>
  <text x="260" y="540" text-anchor="middle" class="sectionTitle">Idem USB-C</text>

  <!-- MCP server -->
  <g transform="translate(600,630)">
    <use href="#serverIcon"/>
  </g>
  <rect x="430" y="625" width="340" height="90" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="600" y="665" text-anchor="middle" class="boxText">MCP Server</text>
  <text x="600" y="690" text-anchor="middle" class="boxSub">Technidata</text>

  <!-- Bidirectional LLM <-> MCP -->
  <line x1="600" y1="360" x2="600" y2="570" stroke="#EEF530" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <line x1="630" y1="570" x2="630" y2="360" stroke="#EEF530" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="770" y="530" text-anchor="middle" class="note">Protocole normalisé</text>

  <!-- Divider dashed line -->
  <line x1="90" y1="740" x2="1110" y2="740" stroke="#94a3b8" stroke-width="3" class="dash"/>

  <!-- SECTION: TDHC -->
  <rect x="80" y="760" width="1040" height="300" rx="20" fill="#fdebd8"/>
  <text x="200" y="850" text-anchor="middle" class="sectionTitle">TDHC</text>
  <text xmlns="http://www.w3.org/2000/svg" x="600" y="830" text-anchor="middle" class="note">Traduction</text>
  <text xmlns="http://www.w3.org/2000/svg" x="630" y="860" text-anchor="middle" class="note">&amp; routage</text>

  <!-- SOAP box -->
  <rect x="240" y="910" width="360" height="110" rx="22" fill="#1f5fbf"/>
  <text x="420" y="960" text-anchor="middle" style="font:700 34px Arial; fill:#ffffff;">API Patient</text>
  <text x="420" y="995" text-anchor="middle" style="font:700 34px Arial; fill:#ffffff;">SOAP</text>

  <!-- ODATA box (NEW) -->
  <rect x="600" y="910" width="360" height="110" rx="22" fill="#0ea5e9"/>
  <text x="780" y="960" text-anchor="middle" style="font:700 30px Arial; fill:#ffffff;">API Générique</text>
  <text x="780" y="995" text-anchor="middle" style="font:700 34px Arial; fill:#ffffff;">ODATA</text>

  <!-- MCP <-> SOAP -->
  <line x1="510" y1="760" x2="510" y2="910" stroke="#d97706" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <line x1="540" y1="910" x2="540" y2="760" stroke="#d97706" stroke-width="4" marker-end="url(#arrowOrange)"/>

  <!-- MCP <-> ODATA (NEW) -->
  <line x1="690" y1="760" x2="690" y2="910" stroke="#d97706" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <line x1="720" y1="910" x2="720" y2="760" stroke="#d97706" stroke-width="4" marker-end="url(#arrowOrange)"/>

  <!-- Divider dashed line -->
  <line x1="90" y1="1080" x2="1110" y2="1080" stroke="#94a3b8" stroke-width="3" class="dash"/>

  <!-- SECTION: Données -->
  <rect x="80" y="1100" width="1040" height="420" rx="20" fill="#efe9ff"/>
  <text x="190" y="1200" text-anchor="middle" class="sectionTitle">Data</text>

  <!-- DB icon -->
  <g transform="translate(600,1360)">
    <use href="#dbIcon"/>
  </g>
  <text x="600" y="1495" text-anchor="middle" class="boxText">Base de données</text>

  <!-- SOAP -> DB and DB -> SOAP (existing) -->
  <line x1="630" y1="1020" x2="630" y2="1270" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="270" y="1150" class="small">Commandes / requêtes</text>

  <line x1="670" y1="1270" x2="670" y2="1040" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="710" y="1220" class="small">Données / entités</text>

  <!-- ODATA -> DB and DB -> ODATA (NEW) -->
  <line x1="540" y1="1020" x2="540" y2="1270" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrowPurple)"/>


  <line x1="570" y1="1270" x2="570" y2="1040" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrowPurple)"/>

</svg>