<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Patients TDMCP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 15px 15px 0 0;
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { opacity: 0.9; font-size: 1.1em; }
        .content { padding: 30px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card h3 { font-size: 2.5em; margin-bottom: 10px; }
        .form-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .form-section h2 { color: #667eea; margin-bottom: 25px; font-size: 1.8em; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 8px; color: #333; }
        input, select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        .btn-group { display: flex; gap: 15px; flex-wrap: wrap; }
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-info { background: #17a2b8; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            text-align: left;
        }
        td { padding: 14px 16px; border-bottom: 1px solid #e0e0e0; }
        tr:hover { background: #f8f9fa; }
        .action-buttons { display: flex; gap: 8px; }
        .action-buttons button { padding: 8px 14px; font-size: 13px; }
        .message {
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: none;
        }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .message.info { background: #d1ecf1; color: #0c5460; }
        .badge { padding: 4px 12px; border-radius: 12px; font-size: 0.85em; font-weight: 600; }
        .badge-male { background: #cfe2ff; color: #084298; }
        .badge-female { background: #f8d7da; color: #842029; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 Gestion des Patients TDMCP</h1>
            <p class="subtitle">Système CRUD - MongoDB Healthcare (Docker)</p>
        </header>
        <div class="content">
            <div id="message" class="message"></div>
            <div class="stats">
                <div class="stat-card"><h3 id="totalPatients">0</h3><p>📊 Total</p></div>
                <div class="stat-card"><h3 id="maleCount">0</h3><p>👨 Hommes</p></div>
                <div class="stat-card"><h3 id="femaleCount">0</h3><p>👩 Femmes</p></div>
            </div>
            <div class="form-section">
                <h2 id="formTitle">➕ Ajouter un patient</h2>
                <form id="patientForm">
                    <input type="hidden" id="editingId">
                    <div class="form-grid">
                        <div class="form-group"><label>ID Patient*</label><input type="number" id="PATID" required></div>
                        <div class="form-group"><label>Numéro*</label><input type="text" id="PATNUMBER" required></div>
                        <div class="form-group"><label>Nom*</label><input type="text" id="NAME" required></div>
                        <div class="form-group"><label>Prénom*</label><input type="text" id="FIRSTNAME" required></div>
                        <div class="form-group"><label>Naissance</label><input type="datetime-local" id="BIRTHDATE"></div>
                        <div class="form-group">
                            <label>Sexe*</label>
                            <select id="SEX" required>
                                <option value="0">Inconnu</option>
                                <option value="1">Masculin</option>
                                <option value="2" selected>Féminin</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Adresse</label><input type="text" id="ADDRESS1"></div>
                        <div class="form-group"><label>Ville</label><input type="text" id="CITY"></div>
                        <div class="form-group"><label>Code Postal</label><input type="text" id="POSTALCODE"></div>
                        <div class="form-group"><label>Téléphone</label><input type="tel" id="TELEPHON"></div>
                        <div class="form-group"><label>Email</label><input type="email" id="EMAIL"></div>
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn-primary">💾 Enregistrer</button>
                        <button type="button" onclick="resetForm()" class="btn-secondary">❌ Annuler</button>
                        <button type="button" onclick="loadPatients()" class="btn-info">🔄 Rafraîchir</button>
                    </div>
                </form>
            </div>
            <div class="table-section">
                <h2>📋 Liste des patients</h2>
                <input type="text" id="searchInput" placeholder="🔍 Rechercher..." style="width:100%;padding:12px;margin-bottom:20px;border:2px solid #e0e0e0;border-radius:8px;">
                <div id="tableContainer">⏳ Chargement...</div>
            </div>
        </div>
    </div>
    <script>
        let allPatients = [];
        let editingId = null;

        document.addEventListener('DOMContentLoaded', () => { loadPatients(); setupSearch(); });
        document.getElementById('patientForm').addEventListener('submit', async (e) => { e.preventDefault(); await savePatient(); });
        function setupSearch() { document.getElementById('searchInput').addEventListener('input', (e) => filterPatients(e.target.value)); }

        async function loadPatients() {
            try {
                showMessage('⏳ Chargement...', 'info');
                const response = await fetch('/api/patients');
                allPatients = await response.json();
                updateStatistics();
                displayPatients(allPatients);
                showMessage('✅ ' + allPatients.length + ' patients chargés', 'success');
            } catch (error) {
                showMessage('❌ Erreur: ' + error.message, 'error');
            }
        }

        function updateStatistics() {
            document.getElementById('totalPatients').textContent = allPatients.length;
            document.getElementById('maleCount').textContent = allPatients.filter(p => p.SEX === 1).length;
            document.getElementById('femaleCount').textContent = allPatients.filter(p => p.SEX === 2).length;
        }

        function displayPatients(patients) {
            const container = document.getElementById('tableContainer');
            if (patients.length === 0) {
                container.innerHTML = '<p style="text-align:center;padding:40px;">📭 Aucun patient</p>';
                return;
            }
            let html = '<table><thead><tr><th>ID</th><th>Numéro</th><th>Nom</th><th>Prénom</th><th>Naissance</th><th>Sexe</th><th>Ville</th><th>Actions</th></tr></thead><tbody>';
            patients.forEach(p => {
                html += '<tr><td><strong>' + (p.PATID || '-') + '</strong></td>';
                html += '<td>' + (p.PATNUMBER || '-') + '</td>';
                html += '<td><strong>' + (p.NAME || '-') + '</strong></td>';
                html += '<td>' + (p.FIRSTNAME || '-') + '</td>';
                html += '<td>' + (p.BIRTHDATE ? new Date(p.BIRTHDATE).toLocaleDateString('fr-FR') : '-') + '</td>';
                html += '<td>' + getSexBadge(p.SEX) + '</td>';
                html += '<td>' + (p.CITY || '-') + '</td>';
                html += '<td><div class="action-buttons">';
                html += '<button onclick="editPatient(\'' + p._id + '\')" class="btn-success">✏️</button>';
                html += '<button onclick="deletePatient(\'' + p._id + '\')" class="btn-danger">🗑️</button>';
                html += '</div></td></tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function filterPatients(searchTerm) {
            const search = searchTerm.toLowerCase();
            const filtered = allPatients.filter(p =>
                (p.NAME && p.NAME.toLowerCase().includes(search)) ||
                (p.FIRSTNAME && p.FIRSTNAME.toLowerCase().includes(search)) ||
                (p.PATNUMBER && p.PATNUMBER.toLowerCase().includes(search))
            );
            displayPatients(filtered);
        }

        async function savePatient() {
            try {
                const data = {
                    PATID: parseInt(document.getElementById('PATID').value),
                    PATNUMBER: document.getElementById('PATNUMBER').value,
                    NAME: document.getElementById('NAME').value,
                    FIRSTNAME: document.getElementById('FIRSTNAME').value,
                    BIRTHDATE: document.getElementById('BIRTHDATE').value || null,
                    SEX: parseInt(document.getElementById('SEX').value),
                    ADDRESS1: document.getElementById('ADDRESS1').value || null,
                    CITY: document.getElementById('CITY').value || null,
                    POSTALCODE: document.getElementById('POSTALCODE').value || null,
                    TELEPHON: document.getElementById('TELEPHON').value || null,
                    EMAIL: document.getElementById('EMAIL').value || null,
                    PATCREATIONDATE: parseInt(new Date().toISOString().slice(0,10).replace(/-/g, '')),
                    LOGDATE: new Date().toISOString(),
                    LOGUSERID: 'WEB_USER'
                };
                const url = editingId ? '/api/patients/' + editingId : '/api/patients';
                const method = editingId ? 'PUT' : 'POST';
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    showMessage(editingId ? '✅ Modifié!' : '✅ Créé!', 'success');
                    resetForm();
                    loadPatients();
                }
            } catch (error) {
                showMessage('❌ Erreur: ' + error.message, 'error');
            }
        }

        function editPatient(id) {
            const p = allPatients.find(patient => patient._id === id);
            if (!p) return;
            editingId = id;
            document.getElementById('formTitle').textContent = '✏️ Modifier le patient';
            document.getElementById('PATID').value = p.PATID || '';
            document.getElementById('PATNUMBER').value = p.PATNUMBER || '';
            document.getElementById('NAME').value = p.NAME || '';
            document.getElementById('FIRSTNAME').value = p.FIRSTNAME || '';
            document.getElementById('BIRTHDATE').value = p.BIRTHDATE ? p.BIRTHDATE.slice(0,16) : '';
            document.getElementById('SEX').value = p.SEX || 0;
            document.getElementById('ADDRESS1').value = p.ADDRESS1 || '';
            document.getElementById('CITY').value = p.CITY || '';
            document.getElementById('POSTALCODE').value = p.POSTALCODE || '';
            document.getElementById('TELEPHON').value = p.TELEPHON || '';
            document.getElementById('EMAIL').value = p.EMAIL || '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deletePatient(id) {
            if (!confirm('⚠️ Supprimer ce patient?')) return;
            try {
                const response = await fetch('/api/patients/' + id, { method: 'DELETE' });
                if (response.ok) {
                    showMessage('✅ Supprimé!', 'success');
                    loadPatients();
                }
            } catch (error) {
                showMessage('❌ Erreur: ' + error.message, 'error');
            }
        }

        function resetForm() {
            editingId = null;
            document.getElementById('formTitle').textContent = '➕ Ajouter un patient';
            document.getElementById('patientForm').reset();
        }

        function getSexBadge(sex) {
            if (sex === 1) return '<span class="badge badge-male">👨 M</span>';
            if (sex === 2) return '<span class="badge badge-female">👩 F</span>';
            return '<span class="badge">❓</span>';
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 4000);
        }
    </script>
</body>
</html>
